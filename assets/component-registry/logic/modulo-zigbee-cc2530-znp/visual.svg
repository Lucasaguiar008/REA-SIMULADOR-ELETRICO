<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-label="Módulo Zigbee CC2530 UART ZNP 2,4 GHz">
<defs><linearGradient id="pcb30" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#134e4a"/></linearGradient><radialGradient id="pin30"><stop stop-color="#fff"/><stop offset=".45" stop-color="#ccfbf1"/><stop offset="1" stop-color="#64748b"/></radialGradient><filter id="sh30"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".32"/></filter><style>.h{font:900 24px Arial,sans-serif;fill:#f0fdfa}.s{font:800 13px Arial,sans-serif;fill:#99f6e4}.n{font:800 13px Arial,sans-serif;fill:#f8fafc}.m{font:900 15px monospace;fill:#f8fafc}.p{fill:#f8fafc;stroke:#334155;stroke-width:3}.a{fill:transparent;stroke:transparent}.led{fill:#253341;stroke:#94a3b8;stroke-width:2}.btn{fill:#0f172a;stroke:#5eead4;stroke-width:2;cursor:pointer}.bt{font:800 11px Arial,sans-serif;fill:#f8fafc;pointer-events:none}</style></defs>
<rect x="28" y="20" width="444" height="360" rx="28" fill="url(#pcb30)" stroke="#042f2e" stroke-width="6" filter="url(#sh30)"/>
<text x="250" y="58" text-anchor="middle" class="h">Zigbee • CC2530</text><text x="250" y="82" text-anchor="middle" class="s">UART/ZNP • 2,4 GHz • 3,3 V</text>
<rect x="155" y="112" width="190" height="112" rx="13" fill="#111827" stroke="#94a3b8" stroke-width="3"/><text x="250" y="155" text-anchor="middle" class="m">CC2530 ZNP</text><text x="250" y="181" text-anchor="middle" class="s">IEEE 802.15.4</text><text x="250" y="205" text-anchor="middle" class="n" data-zigbee-role-label="true">ROUTER</text>
<path d="M363 106h62v14h-48v13h48v14h-48v13h48v14h-62" fill="none" stroke="#fde047" stroke-width="7" stroke-linejoin="round"/><text x="394" y="195" text-anchor="middle" class="s">PCB ANT</text>
<circle cx="96" cy="264" r="11" class="led" data-zigbee-power-led="true"/><text x="114" y="269" class="n">PWR</text><circle cx="191" cy="264" r="11" class="led" data-zigbee-uart-led="true"/><text x="209" y="269" class="n">UART</text><circle cx="298" cy="264" r="11" class="led" data-zigbee-net-led="true"/><text x="316" y="269" class="n">NET</text><circle cx="388" cy="264" r="11" class="led" data-zigbee-tx-led="true"/><text x="406" y="269" class="n">TX</text><circle cx="450" cy="264" r="11" class="led" data-zigbee-rx-led="true"/>
<text x="250" y="301" text-anchor="middle" class="n" data-zigbee-state="true">SEM ALIMENTAÇÃO</text>
<g data-zigbee-role-toggle="true" class="btn"><rect x="118" y="322" width="118" height="34" rx="10"/><text x="177" y="344" text-anchor="middle" class="bt">TROCAR ROLE</text></g><g data-zigbee-send="true" class="btn"><rect x="252" y="322" width="130" height="34" rx="10"/><text x="317" y="344" text-anchor="middle" class="bt">ENVIAR FRAME</text></g>
<g data-terminal="VCC" data-wire-side="left" transform="translate(40 120)"><circle r="14" class="p"/><circle r="6" fill="url(#pin30)"/><circle r="23" class="a" data-wire-anchor="VCC" data-wire-side="left"/><text x="25" y="5" class="n">VCC</text></g>
<g data-terminal="GND" data-wire-side="left" transform="translate(40 190)"><circle r="14" class="p"/><circle r="6" fill="url(#pin30)"/><circle r="23" class="a" data-wire-anchor="GND" data-wire-side="left"/><text x="25" y="5" class="n">GND</text></g>
<g data-terminal="RXD" data-wire-side="left" transform="translate(40 260)"><circle r="14" class="p"/><circle r="6" fill="url(#pin30)"/><circle r="23" class="a" data-wire-anchor="RXD" data-wire-side="left"/><text x="25" y="5" class="n">RXD</text></g>
<g data-terminal="TXD" data-wire-side="right" transform="translate(460 135)"><circle r="14" class="p"/><circle r="6" fill="url(#pin30)"/><circle r="23" class="a" data-wire-anchor="TXD" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">TXD</text></g>
<g data-terminal="RST" data-wire-side="right" transform="translate(460 220)"><circle r="14" class="p"/><circle r="6" fill="url(#pin30)"/><circle r="23" class="a" data-wire-anchor="RST" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">RST</text></g>
</svg>
