  <rect x="33" y="174" width="44" height="32" rx="5" fill="url(#f5-well)" stroke="#687279" stroke-width="1.5"/>
  <rect x="103" y="174" width="44" height="32" rx="5" fill="url(#f5-well)" stroke="#687279" stroke-width="1.5"/>

