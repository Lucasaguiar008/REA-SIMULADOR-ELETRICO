  <text x="110" y="108" text-anchor="end" font-family="Arial, sans-serif" font-size="5.6" font-weight="700" fill="#e5e7eb" class="" font-style="normal" style="font-size: 5.6px; fill: rgb(229, 231, 235); font-family: Arial, sans-serif; font-weight: 700; font-style: normal; text-anchor: end;">5.0 V ⎓</text>
  <text x="70" y="119" font-family="Arial, sans-serif" font-size="5.6" font-weight="700" fill="#b7c0c5" class="" font-style="normal" text-anchor="middle" style="font-size: 5.6px; fill: rgb(183, 192, 197); font-family: Arial, sans-serif; font-weight: 700; font-style: normal; text-anchor: middle;">STATUS</text>
  <circle cx="106" cy="117.5" r="4.2" fill="#22c55e" stroke="#d9ffe6" stroke-width="1.7" data-logic-led="power"/>
