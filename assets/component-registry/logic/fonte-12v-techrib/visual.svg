<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" role="img" aria-label="Fonte TechRib 12 Vcc" data-techrib-editor-managed="true" data-techrib-studio-import="true" data-techrib-preserve-text-style="true">
  <defs>
    <linearGradient id="f5-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f4"/>
      <stop offset="0.46" stop-color="#c9ced2"/>
      <stop offset="1" stop-color="#9ca4aa"/>
    </linearGradient>
    <linearGradient id="f5-edge" x1="0" y1="0" x2="1" y2="0">
