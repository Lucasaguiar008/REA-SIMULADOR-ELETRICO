  <circle cx="26" cy="23" r="2" fill="#858e94" opacity=".75"/>
  <circle cx="154" cy="23" r="2" fill="#858e94" opacity=".75"/>
  <circle cx="26" cy="207" r="2" fill="#858e94" opacity=".75"/>
  <circle cx="154" cy="207" r="2" fill="#858e94" opacity=".75"/>
