  <text x="90" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.8" font-weight="700" fill="#84929a" class="" font-style="normal" style="font-size: 4.8px; fill: rgb(132, 146, 154); font-family: Arial, sans-serif; font-weight: 700; font-style: normal; text-anchor: middle;">DC POWER SUPPLY</text>

