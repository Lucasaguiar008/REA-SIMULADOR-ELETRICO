  <text x="90" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="rgb(255, 255, 255)" font-style="normal" style="font-size: 13px; fill: rgb(255, 255, 255); font-family: Arial, sans-serif; font-weight: 900; font-style: normal; text-anchor: middle;">12 VDC</text>
  <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#cbd5e1" class="" font-style="normal" style="font-size: 6px; fill: rgb(203, 213, 225); font-family: Arial, sans-serif; font-weight: 700; font-style: normal; text-anchor: middle;">FONTE LÓGICA</text>
  <line x1="68" y1="97" x2="112" y2="97" stroke="#66757d" stroke-width="1"/>
