<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Módulo Matter Thread ESP32-H2 RCP">
<defs><linearGradient id="pcb31" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#134e4a"/></linearGradient><radialGradient id="pin31"><stop stop-color="#fff"/><stop offset=".45" stop-color="#dbeafe"/><stop offset="1" stop-color="#64748b"/></radialGradient><filter id="sh31"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".32"/></filter><style>.h{font:900 24px Arial,sans-serif;fill:#ecfeff}.s{font:800 13px Arial,sans-serif;fill:#ccfbf1}.n{font:800 13px Arial,sans-serif;fill:#f8fafc}.m{font:900 15px monospace;fill:#f8fafc}.p{fill:#f8fafc;stroke:#334155;stroke-width:3}.a{fill:transparent;stroke:transparent}.led{fill:#253341;stroke:#94a3b8;stroke-width:2}.btn{fill:#0f172a;stroke:#5eead4;stroke-width:2;cursor:pointer}.bt{font:800 11px Arial,sans-serif;fill:#f8fafc;pointer-events:none}</style></defs>
<rect x="28" y="22" width="464" height="374" rx="28" fill="url(#pcb31)" stroke="#042f2e" stroke-width="6" filter="url(#sh31)"/>
<text x="260" y="58" text-anchor="middle" class="h">Matter / Thread</text><text x="260" y="82" text-anchor="middle" class="s">ESP32-H2 RCP • 802.15.4 • 3,3 V</text>
<rect x="164" y="116" width="192" height="116" rx="14" fill="#111827" stroke="#99f6e4" stroke-width="3"/><text x="260" y="158" text-anchor="middle" class="m">ESP32-H2</text><text x="260" y="184" text-anchor="middle" class="s">THREAD RCP</text><text x="260" y="207" text-anchor="middle" class="n">Matter over IPv6</text>
<path d="M394 108v62m0-62c0-31 45-31 45 0m-45 20c0-21 30-21 30 0" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round"/><circle cx="394" cy="176" r="8" fill="#5eead4"/>
<circle cx="114" cy="275" r="11" class="led" data-matter-power-led="true"/><text x="132" y="280" class="n">PWR</text><circle cx="212" cy="275" r="11" class="led" data-matter-uart-led="true"/><text x="230" y="280" class="n">UART</text><circle cx="317" cy="275" r="11" class="led" data-matter-net-led="true"/><text x="335" y="280" class="n">THREAD</text><circle cx="423" cy="275" r="11" class="led" data-matter-rx-led="true"/><text x="441" y="280" class="n">RX</text>
<text x="260" y="314" text-anchor="middle" class="n" data-matter-role-label="true">END-DEVICE</text><text x="260" y="337" text-anchor="middle" class="n" data-matter-state="true">SEM ALIMENTAÇÃO</text>
<g data-matter-role-toggle="true" class="btn"><rect x="83" y="351" width="155" height="30" rx="9"/><text x="160" y="371" text-anchor="middle" class="bt">TROCAR ROLE</text></g><g data-matter-send="true" class="btn"><rect x="282" y="351" width="155" height="30" rx="9"/><text x="360" y="371" text-anchor="middle" class="bt">ENVIAR MATTER</text></g>
<g data-terminal="VCC" data-wire-side="left" transform="translate(40 118)"><circle r="14" class="p"/><circle r="6" fill="url(#pin31)"/><circle r="23" class="a" data-wire-anchor="VCC" data-wire-side="left"/><text x="25" y="5" class="n">VCC</text></g>
<g data-terminal="GND" data-wire-side="left" transform="translate(40 184)"><circle r="14" class="p"/><circle r="6" fill="url(#pin31)"/><circle r="23" class="a" data-wire-anchor="GND" data-wire-side="left"/><text x="25" y="5" class="n">GND</text></g>
<g data-terminal="RXD" data-wire-side="left" transform="translate(40 250)"><circle r="14" class="p"/><circle r="6" fill="url(#pin31)"/><circle r="23" class="a" data-wire-anchor="RXD" data-wire-side="left"/><text x="25" y="5" class="n">RXD</text></g>
<g data-terminal="TXD" data-wire-side="right" transform="translate(480 118)"><circle r="14" class="p"/><circle r="6" fill="url(#pin31)"/><circle r="23" class="a" data-wire-anchor="TXD" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">TXD</text></g>
<g data-terminal="RST" data-wire-side="right" transform="translate(480 184)"><circle r="14" class="p"/><circle r="6" fill="url(#pin31)"/><circle r="23" class="a" data-wire-anchor="RST" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">RST</text></g>
<g data-terminal="BOOT" data-wire-side="right" transform="translate(480 250)"><circle r="14" class="p"/><circle r="6" fill="url(#pin31)"/><circle r="23" class="a" data-wire-anchor="BOOT" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">BOOT</text></g>
</svg>
