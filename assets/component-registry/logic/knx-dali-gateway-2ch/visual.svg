<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 650" role="img" aria-label="Gateway KNX DALI duas linhas realista">
<defs>
 <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".62" stop-color="#f1f2f2"/><stop offset="1" stop-color="#d5d8da"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7f8"/><stop offset=".4" stop-color="#757d84"/><stop offset=".68" stop-color="#e5e8ea"/><stop offset="1" stop-color="#555d64"/></linearGradient>
 <linearGradient id="button" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#737a80"/><stop offset="1" stop-color="#33383c"/></linearGradient>
 <radialGradient id="g"><stop offset="0" stop-color="#efffe7"/><stop offset=".3" stop-color="#44ff22"/><stop offset="1" stop-color="#0a9000"/></radialGradient>
 <radialGradient id="y"><stop offset="0" stop-color="#fffde3"/><stop offset=".3" stop-color="#ffe21d"/><stop offset="1" stop-color="#a77f00"/></radialGradient>
 <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/></filter>
</defs>
<style>.title{font:700 30px Arial;fill:#353c42}.sub{font:600 15px Arial;fill:#4e555b}.lbl{font:600 15px Arial;fill:#454c52}.tiny{font:600 10px Arial;fill:#555d63}.term{font:700 14px Arial;fill:#353b40}.anchor{fill:transparent;stroke:transparent}.btn{fill:url(#button);stroke:#22272b;stroke-width:2;cursor:pointer}.btnText{font:700 11px Arial;fill:white;pointer-events:none}.lcd{font:700 15px Consolas,monospace;fill:#d9e8f7}</style>
<path d="M24 26h812l12 14v559l-12 16H24L12 599V40z" fill="url(#case)" stroke="#b9bec3" stroke-width="3" filter="url(#sh)"/>
<!-- top terminal deck --> <path d="M35 38h790v125H35z" fill="#f8f9f9" stroke="#d0d3d5"/>
<!-- KNX block -->
<rect x="70" y="60" width="112" height="60" rx="6" fill="#1b5b29" stroke="#173a1e" stroke-width="2"/><rect x="76" y="66" width="49" height="48" rx="4" fill="#3c974d"/><rect x="127" y="66" width="49" height="48" rx="4" fill="#3c974d"/>
<g data-terminal="KNX+" data-wire-side="top"><circle cx="100" cy="90" r="15" fill="url(#metal)" stroke="#22272a" stroke-width="2"/><path d="M90 90h20M100 80v20" stroke="#333" stroke-width="3"/><circle cx="100" cy="90" r="27" class="anchor" data-wire-anchor="KNX+" data-wire-side="top"/></g><g data-terminal="KNX-" data-wire-side="top"><circle cx="152" cy="90" r="15" fill="url(#metal)" stroke="#22272a" stroke-width="2"/><path d="M142 90h20M152 80v20" stroke="#333" stroke-width="3"/><circle cx="152" cy="90" r="27" class="anchor" data-wire-anchor="KNX-" data-wire-side="top"/></g><text x="100" y="141" text-anchor="middle" class="term">KNX+</text><text x="152" y="141" text-anchor="middle" class="term">KNX−</text><text x="126" y="158" text-anchor="middle" class="tiny">KNX BUS</text>
<!-- AC input block -->
<rect x="287" y="61" width="112" height="59" rx="6" fill="#2e713b" stroke="#214d2a" stroke-width="2"/><rect x="293" y="67" width="49" height="47" rx="4" fill="#4d9f5a"/><rect x="344" y="67" width="49" height="47" rx="4" fill="#4d9f5a"/>
<g data-terminal="L" data-wire-side="top"><circle cx="317" cy="91" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M307 91h20M317 81v20" stroke="#333" stroke-width="3"/><circle cx="317" cy="91" r="27" class="anchor" data-wire-anchor="L" data-wire-side="top"/></g><g data-terminal="N" data-wire-side="top"><circle cx="368" cy="91" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M358 91h20M368 81v20" stroke="#333" stroke-width="3"/><circle cx="368" cy="91" r="27" class="anchor" data-wire-anchor="N" data-wire-side="top"/></g><text x="317" y="141" text-anchor="middle" class="term">L</text><text x="368" y="141" text-anchor="middle" class="term">N</text><text x="343" y="158" text-anchor="middle" class="tiny">100–240 V AC</text>
<!-- 2-line DALI block -->
<rect x="553" y="60" width="235" height="60" rx="6" fill="#1b5b29" stroke="#173a1e" stroke-width="2"/>
<g fill="#3c974d"><rect x="559" y="66" width="51" height="48" rx="4"/><rect x="612" y="66" width="51" height="48" rx="4"/><rect x="665" y="66" width="51" height="48" rx="4"/><rect x="718" y="66" width="64" height="48" rx="4"/></g>
<g data-terminal="DA+" data-wire-side="top"><circle cx="585" cy="90" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M575 90h20M585 80v20" stroke="#333" stroke-width="3"/><circle cx="585" cy="90" r="27" class="anchor" data-wire-anchor="DA+" data-wire-side="top"/></g><g data-terminal="DA-" data-wire-side="top"><circle cx="638" cy="90" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M628 90h20M638 80v20" stroke="#333" stroke-width="3"/><circle cx="638" cy="90" r="27" class="anchor" data-wire-anchor="DA-" data-wire-side="top"/></g><g data-terminal="DA2+" data-wire-side="top"><circle cx="691" cy="90" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M681 90h20M691 80v20" stroke="#333" stroke-width="3"/><circle cx="691" cy="90" r="27" class="anchor" data-wire-anchor="DA2+" data-wire-side="top"/></g><g data-terminal="DA2-" data-wire-side="top"><circle cx="750" cy="90" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M740 90h20M750 80v20" stroke="#333" stroke-width="3"/><circle cx="750" cy="90" r="27" class="anchor" data-wire-anchor="DA2-" data-wire-side="top"/></g>
<text x="585" y="141" text-anchor="middle" class="term">DA</text><text x="638" y="141" text-anchor="middle" class="term">DA</text><text x="691" y="141" text-anchor="middle" class="term">DA</text><text x="750" y="141" text-anchor="middle" class="term">DA</text><text x="612" y="158" text-anchor="middle" class="tiny">DALI LINE 1</text><text x="721" y="158" text-anchor="middle" class="tiny">DALI LINE 2</text>
<!-- main panel -->
<path d="M34 176h792v365H34z" fill="#f5f5f4" stroke="#cbcecf" stroke-width="2"/>
<!-- LCD --> <rect x="72" y="217" width="320" height="182" rx="6" fill="#141718" stroke="#383d41" stroke-width="3"/><rect x="91" y="236" width="280" height="31" fill="#aebdcc"/><text x="103" y="258" style="font:700 20px Georgia;fill:#16191b">Status</text><text x="352" y="258" style="font:700 20px Arial;fill:#16191b">›</text>
<text x="100" y="295" class="lcd" data-dali-controller-display="true">SEM ALIMENTAÇÃO</text><text x="100" y="326" class="lcd" data-dali-controller-line="true">DALI LINE: OFF</text><text x="100" y="357" class="lcd" data-dali-controller-status="true">BCAST: OFF • LEVEL: 0%</text><line x1="96" y1="373" x2="367" y2="373" stroke="#81909f"/><text x="100" y="391" style="font:700 12px Consolas;fill:#c7d6e4">KNX / DALI Gateway</text>
<!-- keypad -->
<g transform="translate(470 282)"><path d="M0-45l24 34-10 13h-28l-10-13z" class="btn"/><path d="M45 0L11 24-2 14v-28L11-24z" class="btn"/><path d="M0 45l24-34-10-13h-28l-10 13z" class="btn"/><path d="M-45 0l34 24 13-10v-28l-13-10z" class="btn"/><circle r="29" class="btn"/><text text-anchor="middle" y="5" style="font:700 16px Arial;fill:white">OK</text></g>
<!-- LEDs -->
<g transform="translate(604 226)"><circle r="12" fill="url(#g)" stroke="#2d612c" stroke-width="2" data-power-supply-led="true"/><text x="25" y="5" class="lbl">Power</text></g><g transform="translate(604 267)"><circle r="12" fill="url(#g)" stroke="#2d612c" stroke-width="2" data-knx-dali-knx-led="true"/><text x="25" y="5" class="lbl">KNX</text></g><g transform="translate(604 308)"><circle r="12" fill="url(#g)" stroke="#2d612c" stroke-width="2" data-dali-bus-led="true"/><text x="25" y="5" class="lbl">DALI</text></g><g transform="translate(604 349)"><circle r="12" fill="url(#y)" stroke="#685913" stroke-width="2" data-dali-tx-led="true"/><text x="25" y="5" class="lbl">Communication</text></g><g transform="translate(604 390)"><circle r="11" fill="#60676c" stroke="#2e3438" stroke-width="2"/><text x="25" y="5" class="lbl">Error</text></g>
<text x="581" y="432" style="font:700 25px Arial;fill:#353c42">KNX / DALI</text><text x="581" y="458" style="font:700 21px Arial;fill:#353c42">Gateway</text><text x="584" y="480" class="sub">Intelligent Lighting Control</text>
<!-- lower controls: keep runtime commands -->
<g data-dali-controller-command="scan"><rect x="76" y="432" width="94" height="48" rx="8" class="btn"/><text x="123" y="460" text-anchor="middle" class="btnText">SCAN</text></g><g data-dali-controller-command="on"><rect x="184" y="432" width="94" height="48" rx="8" class="btn"/><text x="231" y="460" text-anchor="middle" class="btnText">BCAST ON</text></g><g data-dali-controller-command="off"><rect x="292" y="432" width="94" height="48" rx="8" class="btn"/><text x="339" y="460" text-anchor="middle" class="btnText">BCAST OFF</text></g>
<rect x="75" y="501" width="313" height="24" rx="4" fill="#e8eaeb" stroke="#c1c5c8"/><text x="232" y="517" text-anchor="middle" class="tiny" data-knx-dali-status="true">KNX aguardando • DALI pronto após alimentação</text>
<!-- lower service bay --> <path d="M34 541h792v55H34z" fill="#e7e9ea" stroke="#c3c7c9"/><rect x="86" y="554" width="54" height="24" rx="3" fill="#1b1e20" stroke="#555" stroke-width="2"/><rect x="95" y="559" width="36" height="13" fill="#050607"/><text x="113" y="591" text-anchor="middle" class="tiny">Service</text><text x="457" y="571" class="tiny">DALI-2 • 2 linhas • PSU integrada 250 mA/linha</text><text x="457" y="589" class="tiny">ETS • 100–240 V AC • 50/60 Hz</text>
</svg>
