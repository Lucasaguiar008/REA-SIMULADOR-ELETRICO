<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Módulo Ethernet W5500 SPI com RJ45">
<defs><linearGradient id="pcb26" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17663e"/><stop offset="1" stop-color="#0b3826"/></linearGradient><linearGradient id="metal26" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2f5"/><stop offset=".5" stop-color="#9aa7b0"/><stop offset="1" stop-color="#4f5b63"/></linearGradient><radialGradient id="s26"><stop stop-color="#fff"/><stop offset=".45" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/></radialGradient><filter id="sh26"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".3"/></filter><style>.t26{font:900 18px Arial,sans-serif;fill:#effff5}.s26{font:800 11px Arial,sans-serif;fill:#c5f5d7}.n26{font:800 10px Arial,sans-serif;fill:#e2fbe9}.p26{fill:#f8fafc;stroke:#475569;stroke-width:3}.a26{fill:transparent;stroke:transparent}.l26{fill:#253341;stroke:#94a3b8;stroke-width:2}.b26{fill:#153343;stroke:#8ec9dd;stroke-width:2;cursor:pointer}.bt26{font:900 10px Arial,sans-serif;fill:#fff;pointer-events:none}.chip26{font:900 16px monospace;fill:#f8fafc}</style></defs>
