<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" role="img" aria-label="Módulo ADC ADS1115 — I2C 16 bits 4 canais">
  <defs>
    <linearGradient id="pcb" x2="0" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="5" stdDeviation="4" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#shadow)"><rect x="34" y="20" width="352" height="388" rx="18" fill="url(#pcb)" stroke="#0f172a" stroke-width="5"/></g>
  <rect x="112" y="68" width="196" height="218" rx="14" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <text x="210" y="96" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#e2e8f0">LucasAguiar</text>
  <text x="210" y="128" text-anchor="middle" font-family="Arial" font-size="28" font-weight="900" fill="#ffffff">ADS1115</text>
  <text x="210" y="154" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#93c5fd">ADC I²C • 16 BITS • 4 CH</text>
  <rect x="132" y="174" width="156" height="72" rx="8" fill="#07111f" stroke="#64748b" stroke-width="2"/>
  <text data-i2c-adc-channel-text="0" x="210" y="202" text-anchor="middle" font-family="monospace" font-size="14" font-weight="900" fill="#67e8f9">A0 0.000 V</text>
  <text data-i2c-adc-raw-text="0" x="210" y="228" text-anchor="middle" font-family="monospace" font-size="13" font-weight="800" fill="#cbd5e1">RAW 0</text>
  <g font-family="Arial" font-size="9" font-weight="900" fill="#e2e8f0">
    <text x="145" y="320">PWR</text><text x="199" y="320">BUS</text><text x="252" y="320">CONV</text><text x="309" y="320">ERR</text>
  </g>
  <circle data-i2c-adc-power-led="true" cx="158" cy="340" r="8" fill="#64748b"/>
  <circle data-i2c-adc-bus-led="true" cx="211" cy="340" r="8" fill="#64748b"/>
  <circle data-i2c-adc-conv-led="true" cx="265" cy="340" r="8" fill="#64748b"/>
  <circle data-i2c-adc-fault-led="true" cx="320" cy="340" r="8" fill="#64748b"/>
  <text x="210" y="378" text-anchor="middle" font-family="Arial" font-size="10" font-weight="800" fill="#dbeafe">0x48 • PGA ±4.096 V • 128 SPS</text>

  <g data-terminal="VDD" data-wire-side="top"><circle cx="155" cy="35" r="13" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><path d="M148 35h14M155 28v14" stroke="#64748b" stroke-width="2"/><circle data-wire-anchor="VDD" class="wire-anchor-hitbox" cx="155" cy="35" r="15" fill="transparent"/><text x="155" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="900" fill="#fff">VDD</text></g>
  <g data-terminal="GND" data-wire-side="top"><circle cx="265" cy="35" r="13" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><path d="M258 35h14" stroke="#64748b" stroke-width="2"/><circle data-wire-anchor="GND" class="wire-anchor-hitbox" cx="265" cy="35" r="15" fill="transparent"/><text x="265" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="900" fill="#fff">GND</text></g>

  <g data-terminal="A0" data-wire-side="left"><circle cx="48" cy="112" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle data-wire-anchor="A0" class="wire-anchor-hitbox" cx="48" cy="112" r="15" fill="transparent"/><text x="70" y="116" font-family="Arial" font-size="11" font-weight="900" fill="#fff">A0</text></g>
  <g data-terminal="A1" data-wire-side="left"><circle cx="48" cy="182" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle data-wire-anchor="A1" class="wire-anchor-hitbox" cx="48" cy="182" r="15" fill="transparent"/><text x="70" y="186" font-family="Arial" font-size="11" font-weight="900" fill="#fff">A1</text></g>
  <g data-terminal="A2" data-wire-side="left"><circle cx="48" cy="252" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle data-wire-anchor="A2" class="wire-anchor-hitbox" cx="48" cy="252" r="15" fill="transparent"/><text x="70" y="256" font-family="Arial" font-size="11" font-weight="900" fill="#fff">A2</text></g>
  <g data-terminal="A3" data-wire-side="left"><circle cx="48" cy="322" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle data-wire-anchor="A3" class="wire-anchor-hitbox" cx="48" cy="322" r="15" fill="transparent"/><text x="70" y="326" font-family="Arial" font-size="11" font-weight="900" fill="#fff">A3</text></g>

  <g data-terminal="SDA" data-wire-side="right"><circle cx="372" cy="105" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle data-wire-anchor="SDA" class="wire-anchor-hitbox" cx="372" cy="105" r="15" fill="transparent"/><text x="348" y="109" text-anchor="end" font-family="Arial" font-size="11" font-weight="900" fill="#fff">SDA</text></g>
  <g data-terminal="SCL" data-wire-side="right"><circle cx="372" cy="175" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle data-wire-anchor="SCL" class="wire-anchor-hitbox" cx="372" cy="175" r="15" fill="transparent"/><text x="348" y="179" text-anchor="end" font-family="Arial" font-size="11" font-weight="900" fill="#fff">SCL</text></g>
  <g data-terminal="ADDR" data-wire-side="right"><circle cx="372" cy="245" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle data-wire-anchor="ADDR" class="wire-anchor-hitbox" cx="372" cy="245" r="15" fill="transparent"/><text x="348" y="249" text-anchor="end" font-family="Arial" font-size="11" font-weight="900" fill="#fff">ADDR</text></g>
  <g data-terminal="ALRT" data-wire-side="right"><circle cx="372" cy="315" r="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><circle data-wire-anchor="ALRT" class="wire-anchor-hitbox" cx="372" cy="315" r="15" fill="transparent"/><text x="348" y="319" text-anchor="end" font-family="Arial" font-size="11" font-weight="900" fill="#fff">ALRT/RDY</text></g>
