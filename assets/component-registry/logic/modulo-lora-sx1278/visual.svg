<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-label="Módulo LoRa SX1278 433 MHz SPI">
<defs><linearGradient id="pcb29" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#172554"/></linearGradient><radialGradient id="pin29"><stop stop-color="#fff"/><stop offset=".45" stop-color="#dbeafe"/><stop offset="1" stop-color="#64748b"/></radialGradient><filter id="sh29"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".32"/></filter><style>.h{font:900 25px Arial,sans-serif;fill:#eff6ff}.s{font:800 13px Arial,sans-serif;fill:#bfdbfe}.n{font:800 13px Arial,sans-serif;fill:#f8fafc}.m{font:900 15px monospace;fill:#f8fafc}.p{fill:#f8fafc;stroke:#334155;stroke-width:3}.a{fill:transparent;stroke:transparent}.led{fill:#253341;stroke:#94a3b8;stroke-width:2}.btn{fill:#0f172a;stroke:#93c5fd;stroke-width:2;cursor:pointer}.bt{font:800 11px Arial,sans-serif;fill:#f8fafc;pointer-events:none}</style></defs>
<rect x="28" y="22" width="464" height="384" rx="28" fill="url(#pcb29)" stroke="#0f172a" stroke-width="6" filter="url(#sh29)"/>
<text x="260" y="59" text-anchor="middle" class="h">LoRa • SX1278</text><text x="260" y="83" text-anchor="middle" class="s">433 MHz • SPI • 3,3 V</text>
<rect x="170" y="118" width="180" height="126" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="3"/><text x="260" y="161" text-anchor="middle" class="m">SX1278</text><text x="260" y="187" text-anchor="middle" class="s">LoRa RF TRANSCEIVER</text><text x="260" y="215" text-anchor="middle" class="n">BW 125 kHz • SF7</text>
<path d="M380 105v78m0-78c0-36 52-36 52 0m-52 22c0-23 34-23 34 0" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/><circle cx="380" cy="188" r="8" fill="#fbbf24"/><text x="408" y="206" text-anchor="middle" class="s">ANT</text>
<circle cx="126" cy="290" r="12" class="led" data-lora-power-led="true"/><text x="146" y="295" class="n">PWR</text><circle cx="228" cy="290" r="12" class="led" data-lora-spi-led="true"/><text x="248" y="295" class="n">SPI</text><circle cx="325" cy="290" r="12" class="led" data-lora-tx-led="true"/><text x="345" y="295" class="n">TX</text><circle cx="415" cy="290" r="12" class="led" data-lora-rx-led="true"/><text x="435" y="295" class="n">RX</text>
<text x="260" y="330" text-anchor="middle" class="n" data-lora-state="true">SEM ALIMENTAÇÃO</text>
<g data-lora-send="true" class="btn"><rect x="173" y="350" width="174" height="34" rx="10"/><text x="260" y="372" text-anchor="middle" class="bt">TRANSMITIR PACOTE</text></g>
<g data-terminal="VCC" data-wire-side="left" transform="translate(40 112)"><circle r="14" class="p"/><circle r="6" fill="url(#pin29)"/><circle r="23" class="a" data-wire-anchor="VCC" data-wire-side="left"/><text x="25" y="5" class="n">VCC</text></g>
<g data-terminal="GND" data-wire-side="left" transform="translate(40 172)"><circle r="14" class="p"/><circle r="6" fill="url(#pin29)"/><circle r="23" class="a" data-wire-anchor="GND" data-wire-side="left"/><text x="25" y="5" class="n">GND</text></g>
<g data-terminal="SCK" data-wire-side="left" transform="translate(40 232)"><circle r="14" class="p"/><circle r="6" fill="url(#pin29)"/><circle r="23" class="a" data-wire-anchor="SCK" data-wire-side="left"/><text x="25" y="5" class="n">SCK</text></g>
<g data-terminal="MOSI" data-wire-side="left" transform="translate(40 292)"><circle r="14" class="p"/><circle r="6" fill="url(#pin29)"/><circle r="23" class="a" data-wire-anchor="MOSI" data-wire-side="left"/><text x="25" y="5" class="n">MOSI</text></g>
<g data-terminal="MISO" data-wire-side="right" transform="translate(480 112)"><circle r="14" class="p"/><circle r="6" fill="url(#pin29)"/><circle r="23" class="a" data-wire-anchor="MISO" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">MISO</text></g>
<g data-terminal="NSS" data-wire-side="right" transform="translate(480 172)"><circle r="14" class="p"/><circle r="6" fill="url(#pin29)"/><circle r="23" class="a" data-wire-anchor="NSS" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">NSS</text></g>
<g data-terminal="RST" data-wire-side="right" transform="translate(480 232)"><circle r="14" class="p"/><circle r="6" fill="url(#pin29)"/><circle r="23" class="a" data-wire-anchor="RST" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">RST</text></g>
<g data-terminal="DIO0" data-wire-side="right" transform="translate(480 292)"><circle r="14" class="p"/><circle r="6" fill="url(#pin29)"/><circle r="23" class="a" data-wire-anchor="DIO0" data-wire-side="right"/><text x="-25" y="5" text-anchor="end" class="n">DIO0</text></g>
</svg>
