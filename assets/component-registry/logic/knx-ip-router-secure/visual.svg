<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-label="KNX IP Router DIN realista" data-techrib-editor-managed="true" data-techrib-studio-import="true" data-techrib-preserve-text-style="true">
<defs>
 <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".58" stop-color="#f4f5f5"/><stop offset="1" stop-color="#d6dade"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7f9"/><stop offset=".45" stop-color="#777f87"/><stop offset=".72" stop-color="#e5e9ec"/><stop offset="1" stop-color="#555d65"/></linearGradient>
 <radialGradient id="g"><stop offset="0" stop-color="#eeffe5"/><stop offset=".32" stop-color="#42ff25"/><stop offset="1" stop-color="#0b8f00"/></radialGradient>
 <radialGradient id="y"><stop offset="0" stop-color="#fffddd"/><stop offset=".32" stop-color="#ffe328"/><stop offset="1" stop-color="#a88100"/></radialGradient>
 <filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".22"/></filter>
</defs>
<style>.title{font:700 31px Arial;fill:#353c42}.sub{font:600 17px Arial;fill:#4f565d}.lbl{font:600 18px Arial;fill:#454c52}.small{font:600 12px Arial;fill:#596168}.anchor{fill:transparent;stroke:transparent}.term{font:700 17px Arial;fill:#343a40}.prog{cursor:pointer}</style>
<path d="M39 25h562l15 15v386l-15 15H39l-15-15V40z" fill="url(#case)" stroke="#b9bec3" stroke-width="3" filter="url(#sh)"/>
<!-- top stepped cap --> <path d="M50 35h540v105H50z" fill="#f7f8f8" stroke="#d0d4d7"/><g fill="#cfd3d6"><rect x="238" y="43" width="22" height="14" rx="2"/><rect x="269" y="43" width="22" height="14" rx="2"/><rect x="300" y="43" width="22" height="14" rx="2"/><rect x="331" y="43" width="22" height="14" rx="2"/><rect x="362" y="43" width="22" height="14" rx="2"/><rect x="393" y="43" width="22" height="14" rx="2"/><rect x="424" y="43" width="22" height="14" rx="2"/></g>
<!-- KNX terminal -->
<rect x="74" y="62" width="104" height="61" rx="5" fill="#1c5b2a" stroke="#1c3320" stroke-width="2"/><rect x="80" y="68" width="45" height="48" rx="4" fill="#3d974e"/><rect x="127" y="68" width="45" height="48" rx="4" fill="#3d974e"/>
<g data-terminal="KNX+" data-wire-side="top"><circle cx="103" cy="92" r="15" fill="url(#metal)" stroke="#262a2d" stroke-width="2"/><path d="M93 92h20M103 82v20" stroke="#333" stroke-width="3"/><circle cx="103" cy="92" r="27" class="anchor" data-wire-anchor="KNX+" data-wire-side="top"/></g>
<g data-terminal="KNX-" data-wire-side="top"><circle cx="150" cy="92" r="15" fill="url(#metal)" stroke="#262a2d" stroke-width="2"/><path d="M140 92h20M150 82v20" stroke="#333" stroke-width="3"/><circle cx="150" cy="92" r="27" class="anchor" data-wire-anchor="KNX-" data-wire-side="top"/></g>
<text x="103" y="137" text-anchor="middle" class="term">KNX+</text><text x="150" y="137" text-anchor="middle" class="term">KNX−</text><text x="513" y="91" text-anchor="middle" class="sub">21…30 V DC</text><text x="513" y="115" text-anchor="middle" class="sub">KNX BUS</text>
<!-- main face -->
<path d="M49 150h542v270H49z" fill="#f7f7f6" stroke="#cacdce" stroke-width="2"/>
<text x="195" y="200" class="title">KNX/IP Router</text><text x="235" y="230" class="sub">R-1000 • Routing / Tunneling / Secure</text>
<!-- RJ45 -->
<g data-terminal="ETH" data-wire-side="left"><rect x="82" y="250" width="151" height="110" rx="5" fill="#565c61" stroke="#202326" stroke-width="3"/><rect x="91" y="258" width="133" height="93" rx="3" fill="#101315" stroke="#b7bcc0" stroke-width="3"/><path d="M105 277h105v55H105z" fill="#050607"/><g fill="#c49b37"><rect x="119" y="302" width="6" height="25"/><rect x="130" y="302" width="6" height="25"/><rect x="141" y="302" width="6" height="25"/><rect x="152" y="302" width="6" height="25"/><rect x="163" y="302" width="6" height="25"/><rect x="174" y="302" width="6" height="25"/><rect x="185" y="302" width="6" height="25"/><rect x="196" y="302" width="6" height="25"/></g><rect x="100" y="265" width="20" height="11" fill="#d5bd29"/><rect x="196" y="265" width="20" height="11" fill="#45ca55"/><circle cx="81" cy="305" r="36" class="anchor" data-wire-anchor="ETH" data-wire-side="left"/></g>
<text x="158" y="389" text-anchor="middle" class="lbl">ETHERNET</text><text x="158" y="409" text-anchor="middle" class="small">10/100 Mbps</text>
<!-- LED column -->
<g transform="translate(332 244)"><circle r="13" fill="url(#g)" stroke="#2d622c" stroke-width="2" data-knx-ip-power-led="true"/><text x="28" y="6" class="lbl">Power</text></g>
<g transform="translate(332 280)"><circle r="13" fill="url(#g)" stroke="#2d622c" stroke-width="2" data-knx-ip-lan-led="true"/><text x="28" y="6" class="lbl">IP</text></g>
<g transform="translate(332 316)"><circle r="13" fill="url(#g)" stroke="#2d622c" stroke-width="2" data-knx-ip-bus-led="true"/><text x="28" y="6" class="lbl">KNX</text></g>
<g transform="translate(332 352)"><circle r="13" fill="url(#y)" stroke="#6b5c14" stroke-width="2"/><text x="28" y="6" class="lbl">Traffic</text></g>
<g transform="translate(332 388)"><circle r="12" fill="#62696f" stroke="#30353a" stroke-width="2" data-knx-ip-prog-led="true"/><text x="28" y="6" class="lbl">Prog</text></g>
<line x1="455" y1="235" x2="455" y2="405" stroke="#8e9499"/>
<g data-knx-ip-prog="true" class="prog"><circle cx="516" cy="310" r="31" fill="#2e3337" stroke="#111" stroke-width="3"/><circle cx="516" cy="310" r="24" fill="#454a4f"/><text x="516" y="361" text-anchor="middle" class="lbl">Prog</text></g>
<!-- lower rail cover --> <path d="M49 420h542v32H49z" fill="#e9ebec" stroke="#c4c8cb"/><text x="80" y="443" class="small">IP20</text><text x="553" y="435" text-anchor="end" class="small">KNX/IP ROUTER</text><text x="553" y="449" text-anchor="end" class="small" data-knx-ip-status="true">KNX BUS • aguardando rede</text>
</svg>