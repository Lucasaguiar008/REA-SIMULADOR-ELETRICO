<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-label="Módulo transceiver CAN TWAI 3,3 volts com CANH e CANL">
<defs><linearGradient id="pcb28" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#172554"/></linearGradient><radialGradient id="pin28"><stop stop-color="#fff"/><stop offset=".45" stop-color="#dbeafe"/><stop offset="1" stop-color="#64748b"/></radialGradient><filter id="sh28"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".3"/></filter><style>.h{font:900 22px Arial,sans-serif;fill:#eff6ff}.s{font:800 13px Arial,sans-serif;fill:#bfdbfe}.n{font:800 12px Arial,sans-serif;fill:#eff6ff}.m{font:900 15px monospace;fill:#f8fafc}.p{fill:#f8fafc;stroke:#334155;stroke-width:3}.a{fill:transparent;stroke:transparent}.led{fill:#253341;stroke:#94a3b8;stroke-width:2}.btn{fill:#0f172a;stroke:#94a3b8;stroke-width:2;cursor:pointer}.bt{font:800 12px Arial,sans-serif;fill:#f8fafc;pointer-events:none}</style></defs>
<rect x="24" y="18" width="392" height="304" rx="26" fill="url(#pcb28)" stroke="#0f172a" stroke-width="6" filter="url(#sh28)"/>
<text x="220" y="53" text-anchor="middle" class="h">CAN / TWAI</text><text x="220" y="76" text-anchor="middle" class="s">TRANSCEIVER 3,3 V • ISO 11898-2</text>
<rect x="142" y="100" width="156" height="86" rx="12" fill="#111827" stroke="#94a3b8" stroke-width="3"/><text x="220" y="132" text-anchor="middle" class="m">SN65HVD230</text><text x="220" y="157" text-anchor="middle" class="s">CAN PHY</text>
<path d="M160 215h120" stroke="#38bdf8" stroke-width="5"/><path d="M160 231h120" stroke="#f59e0b" stroke-width="5"/><text x="220" y="256" text-anchor="middle" class="n">CANH / CANL • PAR DIFERENCIAL</text>
<circle cx="95" cy="281" r="11" class="led" data-can-power-led="true"/><text x="114" y="286" class="n">PWR</text><circle cx="195" cy="281" r="11" class="led" data-can-bus-led="true"/><text x="214" y="286" class="n">BUS</text><circle cx="292" cy="281" r="11" class="led" data-can-tx-led="true"/><text x="311" y="286" class="n">TX</text><circle cx="360" cy="281" r="11" class="led" data-can-rx-led="true"/><text x="379" y="286" class="n">RX</text>
<text x="220" y="307" text-anchor="middle" class="n" data-can-state="true">SEM ALIMENTAÇÃO</text><g data-can-frame="true" class="btn"><rect x="158" y="312" width="124" height="23" rx="8"/><text x="220" y="328" text-anchor="middle" class="bt">SIMULAR FRAME</text></g>
<g data-terminal="VCC" data-wire-side="left" transform="translate(34 105)"><circle r="14" class="p"/><circle r="6" fill="url(#pin28)"/><circle r="23" class="a" data-wire-anchor="VCC" data-wire-side="left"/><text x="24" y="5" class="n">VCC</text></g>
<g data-terminal="GND" data-wire-side="left" transform="translate(34 165)"><circle r="14" class="p"/><circle r="6" fill="url(#pin28)"/><circle r="23" class="a" data-wire-anchor="GND" data-wire-side="left"/><text x="24" y="5" class="n">GND</text></g>
<g data-terminal="TXD" data-wire-side="left" transform="translate(34 235)"><circle r="14" class="p"/><circle r="6" fill="url(#pin28)"/><circle r="23" class="a" data-wire-anchor="TXD" data-wire-side="left"/><text x="24" y="5" class="n">TXD</text></g>
<g data-terminal="RXD" data-wire-side="right" transform="translate(406 105)"><circle r="14" class="p"/><circle r="6" fill="url(#pin28)"/><circle r="23" class="a" data-wire-anchor="RXD" data-wire-side="right"/><text x="-24" y="5" text-anchor="end" class="n">RXD</text></g>
<g data-terminal="CANH" data-wire-side="right" transform="translate(406 190)"><circle r="14" class="p"/><circle r="6" fill="url(#pin28)"/><circle r="23" class="a" data-wire-anchor="CANH" data-wire-side="right"/><text x="-24" y="5" text-anchor="end" class="n">CANH</text></g>
<g data-terminal="CANL" data-wire-side="right" transform="translate(406 250)"><circle r="14" class="p"/><circle r="6" fill="url(#pin28)"/><circle r="23" class="a" data-wire-anchor="CANL" data-wire-side="right"/><text x="-24" y="5" text-anchor="end" class="n">CANL</text></g>
</svg>
