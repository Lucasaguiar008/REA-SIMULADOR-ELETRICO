<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="Módulo receptor 4 a 20 mA para 0 a 3,3 V">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset=".55" stop-color="#d7e0e6"/><stop offset="1" stop-color="#9eafb9"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173444"/><stop offset="1" stop-color="#071720"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".32"/></filter>
    <style>.title{font:900 20px Arial,sans-serif;fill:#ecfeff}.sub{font:800 12px Arial,sans-serif;fill:#9bd8e8}.term{font:900 12px Arial,sans-serif;fill:#162832}.tiny{font:900 10px Arial,sans-serif;fill:#c9e3ec}.read{font:900 22px Consolas,monospace;fill:#67e8f9}.wire-anchor-hitbox{fill:transparent;stroke:transparent}.port{fill:#f8fafc;stroke:#475569;stroke-width:3}.screw{fill:#d8e0e5;stroke:#566671;stroke-width:2}.led{fill:#253341;stroke:#94a3b8;stroke-width:2}</style>
  </defs>
  <rect x="38" y="26" width="444" height="468" rx="28" fill="url(#case)" stroke="#536772" stroke-width="5" filter="url(#shadow)"/>
  <rect x="70" y="78" width="380" height="350" rx="20" fill="url(#face)" stroke="#597786" stroke-width="3"/>
  <text x="260" y="118" text-anchor="middle" class="title">TechRib • 4–20 mA</text>
  <text x="260" y="143" text-anchor="middle" class="sub">RECEPTOR ISOLADO • 0–3,3 V</text>
  <rect x="116" y="176" width="288" height="102" rx="12" fill="#050d13" stroke="#486675" stroke-width="2"/>
  <text x="260" y="215" text-anchor="middle" class="read" data-current-loop-current="true">4.00 mA</text>
  <text x="260" y="251" text-anchor="middle" class="read" data-current-loop-voltage="true">0.000 V</text>
  <g transform="translate(154 324)"><circle cx="0" cy="0" r="12" class="led" data-current-loop-power-led="true"/><text x="0" y="30" text-anchor="middle" class="tiny">PWR</text></g>
  <g transform="translate(260 324)"><circle cx="0" cy="0" r="12" class="led" data-current-loop-signal-led="true"/><text x="0" y="30" text-anchor="middle" class="tiny">LOOP</text></g>
  <g transform="translate(366 324)"><circle cx="0" cy="0" r="12" class="led" data-current-loop-fault-led="true"/><text x="0" y="30" text-anchor="middle" class="tiny">ERR</text></g>
  <text x="260" y="392" text-anchor="middle" class="sub">4 mA = 0,00 V • 20 mA = 3,30 V</text>

  <g data-terminal="IN+" data-wire-side="top" transform="translate(170 40)"><circle r="17" class="port"/><circle r="7" class="screw"/><circle r="23" class="wire-anchor-hitbox" data-wire-anchor="IN+" data-wire-side="top"/><text x="0" y="40" text-anchor="middle" class="term">IN+</text></g>
  <g data-terminal="IN-" data-wire-side="top" transform="translate(350 40)"><circle r="17" class="port"/><circle r="7" class="screw"/><circle r="23" class="wire-anchor-hitbox" data-wire-anchor="IN-" data-wire-side="top"/><text x="0" y="40" text-anchor="middle" class="term">IN-</text></g>

  <g data-terminal="VCC" data-wire-side="bottom" transform="translate(130 480)"><circle r="17" class="port"/><circle r="7" class="screw"/><circle r="23" class="wire-anchor-hitbox" data-wire-anchor="VCC" data-wire-side="bottom"/><text x="0" y="-28" text-anchor="middle" class="term">VCC</text></g>
  <g data-terminal="GND" data-wire-side="bottom" transform="translate(260 480)"><circle r="17" class="port"/><circle r="7" class="screw"/><circle r="23" class="wire-anchor-hitbox" data-wire-anchor="GND" data-wire-side="bottom"/><text x="0" y="-28" text-anchor="middle" class="term">GND</text></g>
  <g data-terminal="OUT" data-wire-side="bottom" transform="translate(390 480)"><circle r="17" class="port"/><circle r="7" class="screw"/><circle r="23" class="wire-anchor-hitbox" data-wire-anchor="OUT" data-wire-side="bottom"/><text x="0" y="-28" text-anchor="middle" class="term">OUT</text></g>
</svg>
