<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 640" role="img" aria-label="SR-GW-EDA DALI IP Gateway DIN realista">
<defs>
 <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".62" stop-color="#f2f3f3"/><stop offset="1" stop-color="#d7dade"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f6f8"/><stop offset=".42" stop-color="#737b82"/><stop offset=".7" stop-color="#e5e8eb"/><stop offset="1" stop-color="#535a61"/></linearGradient>
 <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#777e84"/><stop offset="1" stop-color="#353a3e"/></linearGradient>
 <radialGradient id="g"><stop offset="0" stop-color="#efffe7"/><stop offset=".3" stop-color="#44ff22"/><stop offset="1" stop-color="#0a9000"/></radialGradient>
 <radialGradient id="y"><stop offset="0" stop-color="#fffde3"/><stop offset=".3" stop-color="#ffe21d"/><stop offset="1" stop-color="#a77f00"/></radialGradient>
 <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/></filter>
</defs>
<style>.title{font:700 32px Arial;fill:#343b41}.sub{font:600 16px Arial;fill:#4b5359}.lbl{font:600 17px Arial;fill:#454c52}.tiny{font:600 11px Arial;fill:#596168}.term{font:700 15px Arial;fill:#343b40}.anchor{fill:transparent;stroke:transparent}.button{fill:url(#btn);stroke:#272c30;stroke-width:2;cursor:pointer}.status{font:700 11px Consolas;fill:#34424e}</style>
<path d="M29 22h592l14 15v555l-14 16H29l-14-16V37z" fill="url(#case)" stroke="#bbc0c4" stroke-width="3" filter="url(#sh)"/>
<!-- top terminal deck --> <path d="M42 37h566v130H42z" fill="#f8f9f9" stroke="#d0d3d5"/>
<!-- DALI bus top left --> <rect x="82" y="63" width="116" height="60" rx="6" fill="#1c5b2a" stroke="#173a1e" stroke-width="2"/><rect x="88" y="69" width="50" height="48" rx="4" fill="#3c974d"/><rect x="140" y="69" width="52" height="48" rx="4" fill="#3c974d"/>
<g data-terminal="DA+" data-wire-side="top"><circle cx="113" cy="93" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M103 93h20M113 83v20" stroke="#333" stroke-width="3"/><circle cx="113" cy="93" r="28" class="anchor" data-wire-anchor="DA+" data-wire-side="top"/></g><g data-terminal="DA-" data-wire-side="top"><circle cx="166" cy="93" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M156 93h20M166 83v20" stroke="#333" stroke-width="3"/><circle cx="166" cy="93" r="28" class="anchor" data-wire-anchor="DA-" data-wire-side="top"/></g><text x="113" y="142" text-anchor="middle" class="term">DA</text><text x="166" y="142" text-anchor="middle" class="term">DA</text><text x="140" y="159" text-anchor="middle" class="tiny">DALI BUS</text>
<!-- 24V input top right --> <rect x="425" y="63" width="116" height="60" rx="6" fill="#2e713b" stroke="#214d2a" stroke-width="2"/><rect x="431" y="69" width="50" height="48" rx="4" fill="#4d9f5a"/><rect x="483" y="69" width="52" height="48" rx="4" fill="#4d9f5a"/>
<g data-terminal="V+" data-wire-side="top"><circle cx="456" cy="93" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M446 93h20M456 83v20" stroke="#333" stroke-width="3"/><circle cx="456" cy="93" r="28" class="anchor" data-wire-anchor="V+" data-wire-side="top"/></g><g data-terminal="V-" data-wire-side="top"><circle cx="509" cy="93" r="15" fill="url(#metal)" stroke="#222" stroke-width="2"/><path d="M499 93h20M509 83v20" stroke="#333" stroke-width="3"/><circle cx="509" cy="93" r="28" class="anchor" data-wire-anchor="V-" data-wire-side="top"/></g><text x="456" y="142" text-anchor="middle" class="term">+24V</text><text x="509" y="142" text-anchor="middle" class="term">0V</text><text x="482" y="159" text-anchor="middle" class="tiny">AUX 24 V DC</text>
<!-- face --> <path d="M41 178h568v347H41z" fill="#f7f7f6" stroke="#cacdce" stroke-width="2"/><text x="76" y="231" class="title">DALI / IP Gateway</text><text x="77" y="257" class="sub">SR-GW-EDA • Ethernet • Home Assistant</text>
<!-- Ethernet -->
<g data-terminal="ETH" data-wire-side="left"><rect x="78" y="292" width="151" height="112" rx="5" fill="#53595e" stroke="#202326" stroke-width="3"/><rect x="87" y="300" width="133" height="94" rx="3" fill="#101315" stroke="#b7bcc0" stroke-width="3"/><path d="M101 319h105v56H101z" fill="#050607"/><g fill="#c49b37"><rect x="116" y="344" width="6" height="26"/><rect x="127" y="344" width="6" height="26"/><rect x="138" y="344" width="6" height="26"/><rect x="149" y="344" width="6" height="26"/><rect x="160" y="344" width="6" height="26"/><rect x="171" y="344" width="6" height="26"/><rect x="182" y="344" width="6" height="26"/><rect x="193" y="344" width="6" height="26"/></g><rect x="96" y="307" width="20" height="11" fill="#4ac95a"/><rect x="191" y="307" width="20" height="11" fill="#d6bd28"/><circle cx="77" cy="348" r="38" class="anchor" data-wire-anchor="ETH" data-wire-side="left"/></g><text x="154" y="431" text-anchor="middle" class="lbl">LAN • 10/100 Mbps</text>
<!-- LEDs --> <g transform="translate(300 305)"><circle r="12" fill="url(#g)" stroke="#2d612c" stroke-width="2" data-dali-ip-power-led="true"/><text x="25" y="5" class="lbl">Power</text></g><g transform="translate(300 345)"><circle r="12" fill="url(#g)" stroke="#2d612c" stroke-width="2" data-dali-ip-lan-led="true"/><text x="25" y="5" class="lbl">LAN</text></g><g transform="translate(300 385)"><circle r="12" fill="url(#y)" stroke="#685913" stroke-width="2" data-dali-bus-led="true"/><text x="25" y="5" class="lbl">DALI</text></g><g transform="translate(300 425)"><circle r="12" fill="url(#g)" stroke="#2d612c" stroke-width="2" data-dali-tx-led="true"/><text x="25" y="5" class="lbl">Status</text></g>
<!-- d-pad functional -->
<g transform="translate(505 349)"><g data-dali-controller-command="scan"><path d="M0-62l27 38-11 14h-32l-11-14z" class="button"/><text x="0" y="-31" text-anchor="middle" style="font:700 9px Arial;fill:#fff;pointer-events:none">SCAN</text></g><g data-dali-controller-command="off"><path d="M-62 0l38-27 14 11v32l-14 11z" class="button"/><text x="-37" y="4" text-anchor="middle" style="font:700 9px Arial;fill:#fff;pointer-events:none">OFF</text></g><g data-dali-controller-command="on"><path d="M62 0L24-27 10-16v32l14 11z" class="button"/><text x="37" y="4" text-anchor="middle" style="font:700 9px Arial;fill:#fff;pointer-events:none">ON</text></g><path d="M0 62l27-38-11-14h-32l-11 14z" class="button"/><circle r="7" fill="#1b1e20"/></g>
<g data-dali-ip-reset="true"><circle cx="548" cy="453" r="21" fill="#24282b" stroke="#111" stroke-width="3"/><text x="548" y="486" text-anchor="middle" class="tiny">Reset / Setup</text></g>
<!-- status panel preserving runtime feedback --> <rect x="78" y="457" width="365" height="51" rx="5" fill="#e7eaec" stroke="#bdc3c7"/><text x="91" y="475" class="status" data-dali-controller-display="true">SEM ALIMENTAÇÃO</text><text x="91" y="491" class="status" data-dali-controller-line="true">DALI LINE: OFF</text><text x="91" y="505" class="status" data-dali-controller-status="true">BCAST: OFF • LEVEL: 0%</text>
<!-- lower rail cover --> <path d="M41 525h568v63H41z" fill="#e7e9ea" stroke="#c3c7c9"/><text x="78" y="551" class="tiny">DALI-2 • application controller • PSU integrada</text><text x="78" y="570" class="tiny">Entrada 24 V DC • saída DALI 16 V / 250 mA</text><text x="571" y="552" text-anchor="end" class="tiny">SR-GW-EDA</text><text x="571" y="571" text-anchor="end" class="tiny">DALI / IP</text>
</svg>
