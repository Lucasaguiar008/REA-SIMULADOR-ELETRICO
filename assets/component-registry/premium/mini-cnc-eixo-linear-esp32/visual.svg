<rect x="824" y="122" width="238" height="360" rx="14" fill="#111827" stroke="#334155" stroke-width="3"/><text x="844" y="153" class="lbl">POSIÇÃO ATUAL</text><text x="844" y="185" class="big" data-cnc-position="true">0.0 mm</text><text x="844" y="218" class="lbl">PASSOS</text><text x="844" y="243" class="big" data-cnc-steps="true">0</text><text x="844" y="276" class="lbl">DIREÇÃO</text><text x="844" y="301" class="big" data-cnc-direction="true">→ CW</text><text x="844" y="334" class="lbl">VELOCIDADE</text><text x="844" y="359" class="big" data-cnc-speed="true">200 STEP/s</text><text x="844" y="393" class="lbl">DRV8825</text><text x="844" y="416" class="status" data-cnc-driver="true">AGUARDANDO</text><circle cx="1031" cy="411" r="8" class="ledOff" data-cnc-driver-led="true"/><text x="844" y="448" class="small" data-cnc-limits="true">HOME: OFF • FIM: OFF</text>
