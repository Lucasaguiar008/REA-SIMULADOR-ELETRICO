<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Mini CNC eixo linear ESP32" data-techrib-preserve-text-style="true"><style>
.h{font:800 25px Arial;fill:#fff}.sub{font:700 12px Arial;fill:#cbd5e1}.lbl{font:700 12px Arial;fill:#e2e8f0}.big{font:900 25px monospace;fill:#22d3ee}.small{font:700 10px monospace;fill:#94a3b8}.btn{fill:#1e293b;stroke:#64748b;stroke-width:2;cursor:pointer}.bt{font:800 11px Arial;fill:#fff;pointer-events:none}.scale{font:700 10px Arial;fill:#475569}.tick{stroke:#64748b;stroke-width:2}.status{font:800 13px Arial;fill:#e2e8f0}.ledOff{fill:#334155}.rail{fill:#cbd5e1;stroke:#475569;stroke-width:3}</style>
<rect x="10" y="10" width="1080" height="630" rx="20" fill="#0f172a" stroke="#334155" stroke-width="4"/><rect x="28" y="28" width="1044" height="72" rx="12" fill="#1e293b"/><text x="48" y="63" class="h">MINI CNC • EIXO LINEAR • DRV8825</text><text x="49" y="84" class="sub">ESP32 • STEP/DIR • 250 mm • GT2 20T = 40 mm/rev • 5 passos/mm</text>
<rect x="40" y="122" width="760" height="360" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><rect x="85" y="280" width="660" height="32" rx="10" class="rail"/><rect x="85" y="333" width="660" height="8" rx="4" fill="#111827"/><path d="M95 337 H735" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12 10" data-cnc-belt="true"/><g data-cnc-carriage="true" transform="translate(0 0)"><rect x="92" y="230" width="92" height="115" rx="10" fill="#2563eb" stroke="#1e3a8a" stroke-width="4"/><rect x="112" y="202" width="52" height="58" rx="7" fill="#334155"/><circle cx="138" cy="228" r="16" fill="#0f172a"/><path d="M138 228 v-12" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/><text x="138" y="330" text-anchor="middle" font-family="Arial" font-size="11" font-weight="900" fill="#fff">CARRO</text></g>
