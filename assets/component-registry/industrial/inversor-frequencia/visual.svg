    <circle cx="0" cy="0" r="22" fill="#2b323b" stroke="#1f242b" stroke-width="2"/>
    <line x1="0" y1="0" x2="10" y2="-12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="-26" y="25" class="text-label" font-size="12" fill="#9ca3af" style="white-space: pre;">-</text>
    <text x="26" y="25" class="text-label" font-size="12" fill="#9ca3af" style="white-space: pre;">+</text>
