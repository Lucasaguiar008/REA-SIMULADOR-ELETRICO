<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 820" width="100%" height="100%">
  <defs>
    <style>
      .bg-body { fill: #2b323b; stroke: #1a1e24; stroke-width: 3; }
      .bg-dark { fill: #1f242b; }
      .bg-panel { fill: #15181d; rx: 8px; }
      .panel-border { fill: none; stroke: #3a4350; stroke-width: 2; }
      .terminal-block { fill: #eadaaa; stroke: #8c784b; stroke-width: 1.5; }
      .screw-head { fill: #c0c6ce; stroke: #4a525d; stroke-width: 1.5; }
      .screw-cross { stroke: #1f242b; stroke-width: 2.5; stroke-linecap: round; }
      .text-label { font-family: Arial, sans-serif; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .btn-gray { fill: #4a525d; stroke: #2a3038; stroke-width: 2; cursor: pointer; }
      .btn-gray:hover { fill: #5a6472; }
      .btn-green { fill: #10b981; stroke: #047857; stroke-width: 2; cursor: pointer; }
      .btn-green:hover { fill: #34d399; }
      .btn-red { fill: #ef4444; stroke: #b91c1c; stroke-width: 2; cursor: pointer; }
      .btn-red:hover { fill: #f87171; }
      .led-off { fill: #374151; stroke: #1f2937; stroke-width: 1; }
      .led-green { fill: #10b981; filter: drop-shadow(0px 0px 3px #10b981); }
      .led-yellow { fill: #f59e0b; filter: drop-shadow(0px 0px 3px #f59e0b); }
      .led-red { fill: #ef4444; filter: drop-shadow(0px 0px 3px #ef4444); }
      .segment-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; fill: #ff1111; filter: drop-shadow(0px 0px 4px #ff0000); }
    </style>
    <g id="ground-symbol">
      <circle cx="0" cy="0" r="10" fill="#10b981"/>
      <path d="M-5,-3 L5,-3 M-3,0 L3,0 M-1,3 L1,3" stroke="#ffffff" stroke-width="1.5"/>
    </g>
    <g id="screw">
      <circle cx="0" cy="0" r="14" class="screw-head"/>
      <path d="M-6,0 L6,0 M0,-6 L0,6" class="screw-cross"/>
    </g>
  </defs>
  <rect x="50" y="20" width="400" height="780" rx="25" class="bg-body"/>
  <circle cx="80" cy="45" r="8" fill="#15181d"/>
