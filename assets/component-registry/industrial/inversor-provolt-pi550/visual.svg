 <rect x="145" y="142" width="310" height="66" rx="5" fill="#030303" stroke="#333"/>
 <text x="430" y="188" data-vfd-display="true" text-anchor="end" font-family="Consolas,monospace" font-size="38" font-weight="900" fill="#63e47b" filter="url(#pi-glow)">00.00</text><text x="444" y="186" class="small">Hz</text>
 <circle cx="300" cy="258" r="46" fill="#202020" stroke="#707070" stroke-width="3"/><circle cx="300" cy="258" r="34" fill="#353535" stroke="#0c0c0c"/><line x1="300" y1="258" x2="322" y2="236" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
 <text x="300" y="315" class="small" text-anchor="middle">DIGITAL POT</text>
 <g class="btn" data-vfd-action="mode"><rect x="148" y="238" width="88" height="42" rx="4" fill="url(#pi-key)"/><text x="192" y="264" class="key">PROG</text></g>
 <g class="btn" data-vfd-action="freq-up"><rect x="148" y="292" width="88" height="42" rx="4" fill="url(#pi-key)"/><text x="192" y="319" class="key" font-size="18">▲</text></g>
 <g class="btn" data-vfd-action="freq-down"><rect x="364" y="238" width="88" height="42" rx="4" fill="url(#pi-key)"/><text x="408" y="265" class="key" font-size="18">▼</text></g>
 <g class="btn" data-vfd-action="enter"><rect x="364" y="292" width="88" height="42" rx="4" fill="url(#pi-key)"/><text x="408" y="319" class="key">ENTER</text></g>
 <g class="btn" data-vfd-action="run"><rect x="150" y="352" width="92" height="48" rx="5" fill="#3cbd78"/><text x="196" y="382" class="lbl" font-size="15">RUN</text></g>
 <g class="btn" data-vfd-action="reverse"><rect x="254" y="352" width="92" height="48" rx="5" fill="#d5d5d5"/><text x="300" y="382" class="key">FWD/REV</text></g>
 <g class="btn" data-vfd-action="stop"><rect x="358" y="352" width="92" height="48" rx="5" fill="#d9534f"/><text x="404" y="373" class="lbl">STOP</text><text x="404" y="389" class="lbl" font-size="9">RESET</text></g>
 <circle cx="132" cy="160" r="6" data-vfd-led="run" fill="#28322a"/><circle cx="132" cy="182" r="6" data-vfd-led="fwd" fill="#28322a"/><circle cx="132" cy="204" r="6" data-vfd-led="rev" fill="#28322a"/>

 <text x="300" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#e9e9e9">PROVOLT</text>
 <text x="300" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#7bc997">PI550</text>
 <text x="300" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#cfcfcf">HIGH PERFORMANCE VECTOR • V/F • SVC • VC/PG • PID</text>
