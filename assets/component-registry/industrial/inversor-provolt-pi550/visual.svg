<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 920" role="img" aria-label="Provolt PI550 - inversor de frequência" data-techrib-preserve-text-style="true">
<defs>
  <linearGradient id="pi-body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#454545"/><stop offset=".55" stop-color="#292929"/><stop offset="1" stop-color="#151515"/></linearGradient>
  <linearGradient id="pi-front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#070707"/></linearGradient>
  <linearGradient id="pi-key" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3f3f3"/><stop offset="1" stop-color="#bdbdbd"/></linearGradient>
  <linearGradient id="pi-term" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efe2b9"/><stop offset="1" stop-color="#c5ae76"/></linearGradient>
  <radialGradient id="pi-screw"><stop stop-color="#fff"/><stop offset=".52" stop-color="#d7dde0"/><stop offset="1" stop-color="#667278"/></radialGradient>
  <filter id="pi-shadow"><feDropShadow dx="2" dy="5" stdDeviation="5" flood-opacity=".4"/></filter>
  <filter id="pi-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.lbl{font:800 12px Arial,sans-serif;fill:#f4f4f4;text-anchor:middle}.small{font:700 9px Arial,sans-serif;fill:#c9c9c9}.term{font:900 11px Arial,sans-serif;fill:#f5f5f5;text-anchor:middle}.key{font:900 11px Arial,sans-serif;fill:#282828;text-anchor:middle}.btn{cursor:pointer}.wire-anchor-hitbox{fill:transparent;stroke:transparent}</style>
</defs>
<g filter="url(#pi-shadow)">
 <rect x="72" y="28" width="456" height="862" rx="20" fill="url(#pi-body)" stroke="#0a0a0a" stroke-width="4"/>
 <g fill="#161616"><rect x="106" y="46" width="388" height="18" rx="6"/><rect x="116" y="50" width="42" height="8" rx="2"/><rect x="166" y="50" width="42" height="8" rx="2"/><rect x="216" y="50" width="42" height="8" rx="2"/><rect x="266" y="50" width="42" height="8" rx="2"/><rect x="316" y="50" width="42" height="8" rx="2"/><rect x="366" y="50" width="42" height="8" rx="2"/><rect x="416" y="50" width="42" height="8" rx="2"/></g>
