  <g data-terminal="L2" data-terminal-domain="power" data-terminal-function="power-input" data-terminal-voltage-class="220vac" data-terminal-direction="input" data-wire-side="bottom"><circle class="hit" data-wire-anchor="L2" cx="150" cy="326" r="18"/><circle class="term" cx="150" cy="326" r="9"/><text x="150" y="352" text-anchor="middle" class="lbl">L2</text></g>
