<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 96" preserveAspectRatio="none" role="img" aria-label="Trilho DIN 35 milímetros perfurado">
  <defs>
    <linearGradient id="din-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e0e4"/>
      <stop offset="0.18" stop-color="#f8fafb"/>
      <stop offset="0.42" stop-color="#b9c3c9"/>
      <stop offset="0.67" stop-color="#eef2f4"/>
      <stop offset="1" stop-color="#98a5ad"/>
    </linearGradient>
    <linearGradient id="din-center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab6bd"/>
      <stop offset="0.16" stop-color="#e8edef"/>
      <stop offset="0.5" stop-color="#c3ccd1"/>
      <stop offset="0.84" stop-color="#f3f5f6"/>
      <stop offset="1" stop-color="#9aa7ae"/>
    </linearGradient>
    <linearGradient id="din-slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42515a"/>
      <stop offset="0.35" stop-color="#1e2a31"/>
      <stop offset="1" stop-color="#64737c"/>
    </linearGradient>
    <filter id="din-shadow" x="-5%" y="-30%" width="110%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
    <pattern id="din-perforation" patternUnits="userSpaceOnUse" width="49" height="96">
      <rect x="9" y="41" width="31" height="15" rx="7.5" fill="url(#din-slot)" stroke="#74828a" stroke-width="1.8"/>
      <rect x="11.5" y="43.5" width="26" height="10" rx="5" fill="#182229"/>
      <path d="M14 45.2h21" stroke="#84929a" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
    </pattern>
  </defs>

  <g filter="url(#din-shadow)">
    <rect x="1" y="13" width="99.8%" height="70" rx="5" fill="url(#din-metal)" stroke="#74828a" stroke-width="2"/>
    <rect x="1" y="13" width="99.8%" height="16" rx="4" fill="#e9eef1" stroke="#8d9aa2" stroke-width="1.4"/>
    <rect x="1" y="68" width="99.8%" height="15" rx="4" fill="#aeb9c0" stroke="#74828a" stroke-width="1.4"/>
    <rect x="1" y="27" width="99.8%" height="43" fill="url(#din-center)"/>
    <rect x="1" y="27" width="99.8%" height="43" fill="url(#din-perforation)"/>
    <rect x="1" y="27" width="99.8%" height="2" fill="#ffffff" opacity=".72"/>
    <rect x="1" y="67" width="99.8%" height="2" fill="#66757d" opacity=".62"/>
    <rect x="1" y="13" width="99.8%" height="3" rx="2" fill="#ffffff" opacity=".92"/>
    <rect x="1" y="80" width="99.8%" height="3" rx="2" fill="#6f7d85" opacity=".62"/>
  </g>
