<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" role="img" aria-label="Ventilador de teto">
  <defs>
    <linearGradient id="fanBody" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fdfdfd"/><stop offset="1" stop-color="#cfd6de"/></linearGradient>
    <linearGradient id="fanMetal" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#8c98a6"/></linearGradient>
    <linearGradient id="fanBlade" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#845b32"/><stop offset="1" stop-color="#4b2e17"/></linearGradient>
    <radialGradient id="fanLightOff" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#fff9d7" stop-opacity="0.9"/><stop offset="1" stop-color="#d9dde2" stop-opacity="1"/></radialGradient>
    <radialGradient id="fanLightOn" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#fffef2"/><stop offset="0.55" stop-color="#fff2a8"/><stop offset="1" stop-color="#e8d36a"/></radialGradient>
    <filter id="fanGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fanShadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/></filter>
  </defs>
  <g filter="url(#fanShadow)">
    <rect x="20" y="14" width="220" height="292" rx="18" fill="#0f172a" fill-opacity="0.03"/>
  </g>
  <text x="130" y="20" text-anchor="middle" font-size="12" font-weight="800" fill="#1e3a5f">TechRib • Ventilador de teto</text>
  <g transform="translate(130 40)">
    <rect x="-10" y="0" width="20" height="16" rx="8" fill="url(#fanMetal)" stroke="#6b7280"/>
    <rect x="-4.5" y="14" width="9" height="22" rx="4" fill="#9aa5b1" stroke="#66707b"/>
    <path d="M -26 37 Q 0 23 26 37 L 19 54 Q 0 45 -19 54 Z" fill="url(#fanBody)" stroke="#6d7782" stroke-width="2"/>
  </g>
  <g data-fan-rotor="true" transform="translate(130 104)">
    <g data-fan-blades="true">
      <g transform="rotate(0)"><path d="M 0 12 C 42 18 88 32 118 55 C 104 72 81 78 50 74 C 28 71 10 56 0 40 Z" fill="url(#fanBlade)" stroke="#3a2110" stroke-width="2"/></g>
      <g transform="rotate(90)"><path d="M 0 12 C 42 18 88 32 118 55 C 104 72 81 78 50 74 C 28 71 10 56 0 40 Z" fill="url(#fanBlade)" stroke="#3a2110" stroke-width="2"/></g>
      <g transform="rotate(180)"><path d="M 0 12 C 42 18 88 32 118 55 C 104 72 81 78 50 74 C 28 71 10 56 0 40 Z" fill="url(#fanBlade)" stroke="#3a2110" stroke-width="2"/></g>
      <g transform="rotate(270)"><path d="M 0 12 C 42 18 88 32 118 55 C 104 72 81 78 50 74 C 28 71 10 56 0 40 Z" fill="url(#fanBlade)" stroke="#3a2110" stroke-width="2"/></g>
    </g>
    <circle cx="0" cy="0" r="26" fill="url(#fanBody)" stroke="#5e6772" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#7c8793" stroke="#4b5563"/>
    <ellipse data-fan-light-glow="true" cx="0" cy="38" rx="40" ry="22" fill="#fff3a1" opacity="0" filter="url(#fanGlow)"/>
    <ellipse cx="0" cy="34" rx="32" ry="24" fill="url(#fanBody)" stroke="#6f7882" stroke-width="2"/>
    <ellipse data-fan-light="true" cx="0" cy="38" rx="26" ry="18" fill="url(#fanLightOff)" stroke="#a98f43" stroke-width="1.4"/>
  </g>
  <g transform="translate(130 225)">
    <rect x="-74" y="0" width="148" height="42" rx="11" fill="#f8fafc" stroke="#a7b0ba"/>
    <text x="0" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#0f172a">ESTADO</text>
    <text data-fan-state="true" x="0" y="31" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">PARADO • LUZ OFF</text>
  </g>
  <g transform="translate(24 262)">
    <g data-terminal="F1" data-terminal-domain="power" data-terminal-function="power-input" data-terminal-direction="input"><circle data-wire-anchor="F1" cx="10" cy="18" r="13" fill="#000" fill-opacity="0.001"/><circle cx="10" cy="18" r="7.2" fill="#c68224" stroke="#7c4a10" stroke-width="2"/><circle cx="10" cy="18" r="2.6" fill="#f8d28c"/><text x="10" y="38" text-anchor="middle" font-size="8" font-weight="800">F1</text></g>
    <g data-terminal="F2" data-terminal-domain="power" data-terminal-function="power-input" data-terminal-direction="input"><circle data-wire-anchor="F2" cx="46" cy="18" r="13" fill="#000" fill-opacity="0.001"/><circle cx="46" cy="18" r="7.2" fill="#c68224" stroke="#7c4a10" stroke-width="2"/><circle cx="46" cy="18" r="2.6" fill="#f8d28c"/><text x="46" y="38" text-anchor="middle" font-size="8" font-weight="800">F2</text></g>
    <g data-terminal="F3" data-terminal-domain="power" data-terminal-function="power-input" data-terminal-direction="input"><circle data-wire-anchor="F3" cx="82" cy="18" r="13" fill="#000" fill-opacity="0.001"/><circle cx="82" cy="18" r="7.2" fill="#c68224" stroke="#7c4a10" stroke-width="2"/><circle cx="82" cy="18" r="2.6" fill="#f8d28c"/><text x="82" y="38" text-anchor="middle" font-size="8" font-weight="800">F3</text></g>
    <g data-terminal="LIGHT" data-terminal-domain="power" data-terminal-function="power-input" data-terminal-direction="input"><circle data-wire-anchor="LIGHT" cx="118" cy="18" r="13" fill="#000" fill-opacity="0.001"/><circle cx="118" cy="18" r="7.2" fill="#c68224" stroke="#7c4a10" stroke-width="2"/><circle cx="118" cy="18" r="2.6" fill="#f8d28c"/><text x="118" y="38" text-anchor="middle" font-size="8" font-weight="800">LUZ</text></g>
    <g data-terminal="N" data-terminal-domain="power" data-terminal-function="neutral" data-terminal-direction="input"><circle data-wire-anchor="N" cx="154" cy="18" r="13" fill="#000" fill-opacity="0.001"/><circle cx="154" cy="18" r="7.2" fill="#2563eb" stroke="#1e40af" stroke-width="2"/><circle cx="154" cy="18" r="2.6" fill="#c7ddff"/><text x="154" y="38" text-anchor="middle" font-size="8" font-weight="800">N</text></g>
    <g data-terminal="PE" data-terminal-domain="PE" data-terminal-function="protective-earth" data-terminal-direction="input"><circle data-wire-anchor="PE" cx="190" cy="18" r="13" fill="#000" fill-opacity="0.001"/><circle cx="190" cy="18" r="7.2" fill="#16a34a" stroke="#166534" stroke-width="2"/><circle cx="190" cy="18" r="2.6" fill="#bbf7d0"/><text x="190" y="38" text-anchor="middle" font-size="8" font-weight="800">PE</text></g>
  </g>
</svg>