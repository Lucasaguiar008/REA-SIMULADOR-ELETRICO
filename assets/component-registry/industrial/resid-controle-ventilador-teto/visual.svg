    <linearGradient id="ctrlFace" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde3ea"/></linearGradient>
    <linearGradient id="ctrlKey" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fcfcfd"/><stop offset="1" stop-color="#cbd5df"/></linearGradient>
    <filter id="ctrlShadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.25"/></filter>
